name: Diag Bisect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-bisect.yml"]

jobs:
  test:
    name: Test (shard ${{ matrix.shard-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        shard-index: [1, 2, 3, 4]
        shard-total: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "9.x"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run:
          pnpm test:ci --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}
          --coverage

  downstream:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - run: echo "downstream ok"
