name: Diag Bisect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-bisect.yml"]

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  security-scan:
    name: Security Scan (SAST/DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "9.x"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check code headers
        run: pnpm check-headers
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint code
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" || true

  test:
    name: Test (shard ${{ matrix.shard-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        shard-index: [1, 2, 3, 4]
        shard-total: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "9.x"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run:
          pnpm test:ci --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}
          --coverage

  downstream:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - run: echo "downstream ok"
