name: PR Labeler

on:
  pull_request_target:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate labels from changed files
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
